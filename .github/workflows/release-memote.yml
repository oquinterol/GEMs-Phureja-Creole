name: Generate MEMOTE Report on Release

on:
  release:
    types: [published]

jobs:
  generate-memote-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglpk-dev glpk-utils

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run FBA smoke test
      run: |
        python scripts/validation/fba_smoke.py \
          --model models/current/CreolePotato.xml \
          --out reports/smoke.log
        cat reports/smoke.log

    - name: Generate MEMOTE report
      run: |
        mkdir -p reports
        memote report snapshot \
          models/current/CreolePotato.xml \
          --filename reports/memote_report_${{ github.event.release.tag_name }}.html

    - name: Upload assets to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} \
          models/current/CreolePotato.xml#CreolePotato_${{ github.event.release.tag_name }}.xml \
          reports/memote_report_${{ github.event.release.tag_name }}.html

    - name: Generate summary
      run: |
        echo "## MEMOTE Report Generated Successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Model: CreolePotato.xml" >> $GITHUB_STEP_SUMMARY
        echo "- Report: memote_report_${{ github.event.release.tag_name }}.html" >> $GITHUB_STEP_SUMMARY
        echo "- Both files uploaded as release assets" >> $GITHUB_STEP_SUMMARY
